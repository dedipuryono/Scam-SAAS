<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldCheck - Global Digital Investigation Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full py-4 px-6 md:px-12 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center space-x-2">
            <div class="bg-blue-600 p-2 rounded-lg">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
            </div>
            <span class="text-xl font-bold tracking-wide">ShieldCheck</span>
        </div>

        <!-- Tombol Pilihan Bahasa -->
        <div class="flex items-center space-x-4">
            <select id="langSelect" class="bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-indigo-500 cursor-pointer">
                <option value="id">🇮🇩 Bahasa Indonesia</option>
                <option value="en">🇬🇧 English</option>
                <option value="es">🇪🇸 Español</option>
                <option value="zh">🇨🇳 中文</option>
            </select>
            <div class="hidden md:flex space-x-4 text-sm text-slate-400">
                <a href="#tentang" class="hover:text-white transition">About</a>
                <a href="#laporkan" class="hover:text-white transition">Report</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 text-center my-12">
        <h1 id="mainTitle" class="text-3xl md:text-5xl font-extrabold max-w-3xl leading-tight mb-4">
            Cek Akun, Toko, atau Influencer Ini Penipu atau Asli?
        </h1>
        <p id="mainDesc" class="text-slate-400 max-w-xl mb-8 text-sm md:text-base">
            Masukkan link profil atau username media sosial untuk mendapatkan laporan audit keamanan instan berbasis AI.
        </p>

        <!-- Form Input -->
        <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 p-2 rounded-2xl flex flex-col md:flex-row gap-2 shadow-2xl">
            <input 
                type="text" 
                id="targetInput" 
                placeholder="Contoh: @sneakers_murah_jkt atau link profil..." 
                class="flex-grow bg-transparent px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none text-sm md:text-base"
            >
            <button 
                onclick="handleAnalysis()" 
                id="submitBtn"
                class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl transition text-sm md:text-base shadow-lg shadow-indigo-600/30"
            >
                Analisis Sekarang
            </button>
        </div>

        <!-- Hasil Analisis -->
        <div id="resultContainer" class="w-full max-w-2xl mt-8 hidden bg-slate-900 border border-slate-800 p-6 rounded-2xl text-left">
            <h3 class="text-lg font-bold text-indigo-400 mb-2">Hasil Audit Keamanan:</h3>
            <div id="resultText" class="text-slate-300 text-sm whitespace-pre-line leading-relaxed"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs text-slate-500 border-t border-slate-900">
        <p class="mb-1">[ ADVERTISING SPACE ]</p>
        <p>&copy; 2026 ShieldCheck. Global Digital Investigation Database.</p>
    </footer>

    <!-- Script Utama -->
    <script>
        const translations = {
            id: {
                title: "Cek Akun, Toko, atau Influencer Ini Penipu atau Asli?",
                desc: "Masukkan link profil atau username media sosial untuk mendapatkan laporan audit keamanan instan berbasis AI.",
                placeholder: "Contoh: @sneakers_murah_jkt atau link profil...",
                btnText: "Analisis Sekarang",
                loadingText: "Menganalisis...",
                resultTitle: "Hasil Audit Keamanan:"
            },
            en: {
                title: "Verify Account, Store, or Influencer: Scam or Genuine?",
                desc: "Enter a social media profile link or username to get an instant AI-powered security audit report.",
                placeholder: "Example: @username or profile link...",
                btnText: "Analyze Now",
                loadingText: "Analyzing...",
                resultTitle: "Security Audit Result:"
            },
            es: {
                title: "¿Verificar Cuenta, Tienda o Influencer: Estafa o Real?",
                desc: "Ingrese un enlace de perfil o nombre de usuario de redes sociales para obtener un informe de auditoría de seguridad instantáneo con IA.",
                placeholder: "Ejemplo: @usuario o enlace de perfil...",
                btnText: "Analizar Ahora",
                loadingText: "Analizando...",
                resultTitle: "Resultado de Auditoría de Seguridad:"
            },
            zh: {
                title: "核实账号、商店或网红：是骗局还是正品？",
                desc: "输入社交媒体个人资料链接或用户名，即可获取由人工智能驱动的即时安全审计报告。",
                placeholder: "例如：@用户名 或主页链接...",
                btnText: "立即分析",
                loadingText: "分析中...",
                resultTitle: "安全审计结果："
            }
        };

        document.getElementById('langSelect').addEventListener('change', function() {
            const lang = this.value;
            const t = translations[lang];
            
            document.getElementById('mainTitle').innerText = t.title;
            document.getElementById('mainDesc').innerText = t.desc;
            document.getElementById('targetInput').placeholder = t.placeholder;
            document.getElementById('submitBtn').innerText = t.btnText;
            document.querySelector('#resultContainer h3').innerText = t.resultTitle;
        });

        async function handleAnalysis() {
            const targetInput = document.getElementById('targetInput').value.trim();
            const btn = document.getElementById('submitBtn');
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');
            const currentLang = document.getElementById('langSelect').value;
            const t = translations[currentLang];

            if (!targetInput) {
                alert(currentLang === 'id' ? 'Silakan masukkan username atau link terlebih dahulu!' : 'Please enter a username or link first!');
                return;
            }

            btn.innerText = t.loadingText;
            btn.disabled = true;
            resultContainer.classList.add('hidden');

            const supabaseUrl = 'https://wwofcqkjgullkphpaexz.supabase.co/rest/v1/scam_reports';
            const supabaseKey = 'sb_publishable_C14TG-LjEYMnGzUT400FJw_HRswxjh7';

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        target: targetInput, 
                        lang: currentLang 
                    })
                });

                const aiData = await response.json();
                
                if (!response.ok) {
                    throw new Error(aiData.error || 'Terjadi kesalahan pada server.');
                }

                if (!aiData.candidates || !aiData.candidates[0].content) {
                    throw new Error('Format respons AI tidak valid.');
                }

                const analysisResult = aiData.candidates[0].content.parts[0].text;

                resultText.innerText = analysisResult;
                resultContainer.classList.remove('hidden');

                // Simpan ke Supabase
                fetch(supabaseUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': supabaseKey,
                        'Authorization': `Bearer ${supabaseKey}`
                    },
                    body: JSON.stringify({
                        target: targetInput,
                        risk_score: 'AI Analyzed (' + currentLang.toUpperCase() + ')',
                        analysis_summary: analysisResult,
                        status: 'Verified'
                    })
                }).catch(err => console.log('Supabase log:', err));

            } catch (error) {
                console.error('Analysis error:', error);
                resultText.innerText = (currentLang === 'id' ? 'Gagal: ' : 'Error: ') + error.message;
                resultContainer.classList.remove('hidden');
            } finally {
                btn.innerText = t.btnText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
